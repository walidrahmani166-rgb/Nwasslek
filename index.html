<body>

<div class="container">

  <div class="header">
    <h1>🚚 Nwasslek</h1>
    <p>Calculateur de prix de livraison - Médéa</p>
  </div>

  <div class="card">

    <label for="from">📍 نقطة الانطلاق</label>
    <input
      id="from"
      list="places"
      placeholder="مثال: تاكبو"
      autocomplete="off"
    >

    <label for="to">🏁 نقطة الوصول</label>
    <input
      id="to"
      list="places"
      placeholder="مثال: قطيطين"
      autocomplete="off"
    >

    <datalist id="places"></datalist>

    <button id="calculateBtn" onclick="calculatePrice()">
      احسب سعر التوصيل
    </button>

    <div class="loading" id="loading">
      ⏳ جاري حساب المسافة عبر الطريق...
    </div>

    <div class="error" id="error"></div>

  </div>

  <div class="card result" id="result">

    <div>المسافة عبر الطريق</div>

    <div class="km" id="distance"></div>

    <div>سعر التوصيل</div>

    <div class="price" id="price"></div>

    <div id="correction"></div>

  </div>

  <div class="small">
    السعر يحسب حسب المسافة الفعلية بين نقطة الانطلاق والوصول.
  </div>

  <div class="osm">
    © OpenStreetMap contributors
  </div>

</div>

<script>

/* =========================================================

/* =========================================================
   2. أسماء بديلة للمساعدة في البحث الذكي

const ALIASES = {

/* =========================================================
   3. إحداثيات محلية مؤكدة
   ========================================================= */

const LOCAL_COORDS = {

  "مédéa": {
    lat:36.2675,
    lon:2.7500
  },

  "تاكبو": {
    lat:36.26049,
    lon:2.77299
  },

  "عين الذهب": {
    lat:36.26672,
    lon:2.78108
  },

  "كوالة": {
    lat:36.28923,
    lon:2.76317
  },

  "مرج شكير": {
    lat:36.27866,
    lon:2.76039
  },

  "الكتاب": {
    lat:36.27097,
    lon:2.78130
  },

  "باتي": {
    lat:36.24803,
    lon:2.74210
  },

  "مكراز": {
    lat:36.24657,
    lon:2.74168
  },

  "واد زيتون": {
    lat:36.25206,
    lon:2.76358
  },

  "قطيطين": {
    lat:36.25391,
    lon:2.75658
  }
};

/* =========================================================
   4. التسعيرة حسب المسافة
   ========================================================= */

function getPrice(km){

  if(km <= 1)  return 150;
  if(km <= 2)  return 200;
  if(km <= 4)  return 250;
  if(km <= 6)  return 300;
  if(km <= 8)  return 350;
  if(km <= 10) return 400;
  if(km <= 12) return 450;
  if(km <= 14) return 500;
  if(km <= 15) return 550;

  return 550 + Math.ceil(km - 15) * 50;
}

/* =========================================================
   5. تجهيز القائمة
   ========================================================= */

const datalist = document.getElementById("places");

PLACES.forEach(place => {

  const option = document.createElement("option");
  option.value = place;
  datalist.appendChild(option);

});

/* =========================================================
   6. تنظيف النص
   ========================================================= */

function normalize(text){

  return text
    .toLowerCase()
    .trim()

    .replace(/[أإآ]/g,"ا")
    .replace(/ة/g,"ه")
    .replace(/ى/g,"ي")

    .replace(/[ًٌٍَُِّْـ]/g,"")

    .replace(/['’`]/g,"")

    .replace(/[-_]/g," ")

    .replace(/\s+/g," ");
}

/* =========================================================
   7. مسافة Levenshtein
   ========================================================= */

function levenshtein(a,b){

  const matrix = [];

  for(let i=0;i<=b.length;i++){
    matrix[i]=[i];
  }

  for(let j=0;j<=a.length;j++){
    matrix[0][j]=j;
  }

  for(let i=1;i<=b.length;i++){

    for(let j=1;j<=a.length;j++){

      if(b.charAt(i-1) === a.charAt(j-1)){
        matrix[i][j]=matrix[i-1][j-1];
      }else{
        matrix[i][j]=Math.min(
          matrix[i-1][j-1]+1,
          matrix[i][j-1]+1,
          matrix[i-1][j]+1
        );
      }

    }
  }

  return matrix[b.length][a.length];
}

/* =========================================================
   8. البحث الذكي عن المكان
   ========================================================= */

function findBestPlace(input){

  const value = normalize(input);

  if(!value){
    return null;
  }

  /* تطابق مباشر */

  for(const place of PLACES){

    if(normalize(place) === value){
      return {
        name:place,
        score:0,
        corrected:false
      };
    }

  }

  /* البحث داخل الأسماء البديلة */

  let best = null;

  for(const place of PLACES){

    const names = [
      place,
      ...(ALIASES[place] || [])
    ];

    for(const name of names){

      const n = normalize(name);

      if(n === value){

        return {
          name:place,
          score:0,
          corrected:true
        };

      }

      if(n.includes(value) || value.includes(n)){

        const score = Math.abs(n.length-value.length);

        if(!best || score < best.score){

          best = {
            name:place,
            score:score,
            corrected:true
          };

        }

      }

    }

  }

  /* Levenshtein */

  for(const place of PLACES){

    const names = [
      place,
      ...(ALIASES[place] || [])
    ];

    for(const name of names){

      const n = normalize(name);

      const distance = levenshtein(value,n);

      const maxLength = Math.max(value.length,n.length);

      const similarity = 1 - distance / maxLength;

      if(similarity >= 0.55){

        if(!best || distance < best.score){

          best = {
            name:place,
            score:distance,
            corrected:true
          };

        }

      }

    }

  }

  return best;
}

/* =========================================================
   9. Cache الإحداثيات
   ========================================================= */

function getCache(){

  try{
    return JSON.parse(localStorage.getItem("nwasslek_coords") || "{}");
  }catch(e){
    return {};
  }

}

function saveCache(cache){

  localStorage.setItem(
    "nwasslek_coords",
    JSON.stringify(cache)
  );

}

/* =========================================================
   10. انتظار Nominatim
   ========================================================= */

let lastNominatimRequest = 0;

async function waitForNominatim(){

  const now = Date.now();

  const wait = Math.max(
    0,
    1200 - (now-lastNominatimRequest)
  );

  if(wait > 0){

    await new Promise(resolve =>
      setTimeout(resolve,wait)
    );

  }

  lastNominatimRequest = Date.now();
}

/* =========================================================
   11. Geocoding
   ========================================================= */

async function geocodePlace(place){

  /* أولاً الإحداثيات المحلية */

  if(LOCAL_COORDS[place]){
    return LOCAL_COORDS[place];
  }

  /* Cache */

  const cache = getCache();

  if(cache[place]){
    return cache[place];
  }

  let queries = [];

  if(place === "Rue d'Algé"){

    queries = [
      "Rue d'Alger, Médéa, Algérie",
      "Route d'Alger, Médéa, Algérie",
      "طريق الجزائر، المدية، الجزائر"
    ];

  }else{

    const aliases = ALIASES[place] || [];

    queries = [
      `${place}, Médéa, Algérie`,
      ...aliases.map(x => `${x}, Médéa, Algérie`)
    ];

  }

  for(const query of queries){

    try{

      await waitForNominatim();

      const url =
        "https://nominatim.openstreetmap.org/search" +
        "?format=jsonv2" +
        "&limit=1" +
        "&countrycodes=dz" +
        "&q=" +
        encodeURIComponent(query);

      const response = await fetch(url);

      if(!response.ok){
        continue;
      }

      const data = await response.json();

      if(data && data.length){

        const result = {
          lat:parseFloat(data[0].lat),
          lon:parseFloat(data[0].lon)
        };

        /*
         * نحفظ النتيجة حتى ما نعاودوش
         * نفس البحث كل مرة.
         */

        cache[place] = result;
        saveCache(cache);

        return result;
      }

    }catch(error){

      console.log(
        "Geocoding error:",
        query,
        error
      );

    }

  }

  return null;
}

/* =========================================================
   12. حساب المسافة بالطريق باستعمال OSRM
   ========================================================= */

async function getRoadDistance(a,b){

  const url =
    "https://router.project-osrm.org/route/v1/driving/" +
    `${a.lon},${a.lat};${b.lon},${b.lat}` +
    "?overview=false";

  const response = await fetch(url);

  if(!response.ok){
    throw new Error("تعذر الاتصال بخدمة حساب الطريق.");
  }

  const data = await response.json();

  if(
    !data.routes ||
    !data.routes.length
  ){
    throw new Error("لم يتم العثور على طريق بين المكانين.");
  }

  return data.routes[0].distance / 1000;
}

/* =========================================================
   13. إظهار الخطأ
   ========================================================= */

function showError(message){

  const error = document.getElementById("error");

  error.textContent = message;
  error.style.display = "block";

}

/* =========================================================
   14. الحساب الرئيسي
   ========================================================= */

async function calculatePrice(){

  const fromInput =
    document.getElementById("from").value;

  const toInput =
    document.getElementById("to").value;

  const button =
    document.getElementById("calculateBtn");

  const loading =
    document.getElementById("loading");

  const result =
    document.getElementById("result");

  const error =
    document.getElementById("error");

  const correction =
    document.getElementById("correction");

  error.style.display = "none";
  result.style.display = "none";
  correction.innerHTML = "";

  if(!fromInput || !toInput){

    showError(
      "⚠️ اكتب نقطة الانطلاق ونقطة الوصول."
    );

    return;
  }

  const from = findBestPlace(fromInput);
  const to = findBestPlace(toInput);

  if(!from){

    showError(
      `❌ لم أتعرف على "${fromInput}".`
    );

    return;
  }

  if(!to){

    showError(
      `❌ لم أتعرف على "${toInput}".`
    );

    return;
  }

  /*
   * نبدل الاسم تلقائياً بالاسم الصحيح
   */

  if(from.name !== fromInput.trim()){

    document.getElementById("from").value =
      from.name;

  }

  if(to.name !== toInput.trim()){

    document.getElementById("to").value =
      to.name;

  }

  button.disabled = true;
  loading.style.display = "block";

  try{

    const fromCoords =
      await geocodePlace(from.name);

    const toCoords =
      await geocodePlace(to.name);

    if(!fromCoords){

      throw new Error(
        `لم أستطع تحديد موقع "${from.name}" على الخريطة.`
      );

    }

    if(!toCoords){

      throw new Error(
        `لم أستطع تحديد موقع "${to.name}" على الخريطة.`
      );

    }

    const km =
      await getRoadDistance(
        fromCoords,
        toCoords
      );

    const price =
      getPrice(km);

    document.getElementById("distance").textContent =
      km.toFixed(1) + " كم";

    document.getElementById("price").textContent =
      price.toLocaleString("fr-DZ") + " دج";

    let messages = [];

    if(from.corrected){

      messages.push(
        `نقطة الانطلاق: تم تصحيحها إلى «${from.name}»`
      );

    }

    if(to.corrected){

      messages.push(
        `نقطة الوصول: تم تصحيحها إلى «${to.name}»`
      );

    }

    if(messages.length){

      correction.innerHTML =
        `<div class="corrected">💡 ${messages.join("<br>")}</div>`;

    }

    result.style.display = "block";

  }catch(err){

    console.error(err);

    showError(
      "❌ " + err.message
    );

  }finally{

    button.disabled = false;
    loading.style.display = "none";

  }

}

/* =========================================================
   15. Enter للحساب
   ========================================================= */

document.getElementById("from").addEventListener(
  "keydown",
  e => {
    if(e.key === "Enter"){
      document.getElementById("to").focus();
    }
  }
);

document.getElementById("to").addEventListener(
  "keydown",
  e => {
    if(e.key === "Enter"){
      calculatePrice();
    }
  }
);

</script>
