/* =========================================================
   NORMALIZE
========================================================= */

function normalizeText(text){

if(!text)return"";

return text
.toString()
.trim()
.toLowerCase()
.replace(/[إأآا]/g,"ا")
.replace(/ى/g,"ي")
.replace(/ئ/g,"ي")
.replace(/ؤ/g,"و")
.replace(/ة/g,"ه")
.replace(/[’'`´"]/g,"")
.replace(/[.,،؛;:_\-\/\\()[\]{}]/g," ")
.replace(/\s+/g," ")
.trim();

}


/* =========================================================
   LEVENSHTEIN
========================================================= */

function levenshtein(a,b){

const m=[];

for(let i=0;i<=b.length;i++)m[i]=[i];

for(let j=0;j<=a.length;j++)m[0][j]=j;

for(let i=1;i<=b.length;i++){

for(let j=1;j<=a.length;j++){

m[i][j]=
b[i-1]===a[j-1]
?m[i-1][j-1]
:Math.min(
m[i-1][j-1]+1,
m[i][j-1]+1,
m[i-1][j]+1
);

}
}

return m[b.length][a.length];

}


/* =========================================================
   SMART MATCH
========================================================= */

function similarity(a,b){

a=normalizeText(a);
b=normalizeText(b);

if(!a||!b)return 0;

if(a===b)return 1;

if(a.includes(b)||b.includes(a))return .9;

return 1-
levenshtein(a,b)/
Math.max(a.length,b.length);

}


function findPlace(input){

const original=(input||"").trim();

if(!original)return null;

const normalized=normalizeText(original);


/* exact */
for(const place of PLACES){

if(normalizeText(place)===normalized){

return{
place,
changed:place!==original,
score:1
};

}

}


/* aliases */
for(const place of PLACES){

for(const alias of(ALIASES[place]||[])){

if(normalizeText(alias)===normalized){

return{
place,
changed:true,
score:1
};

}

}

}


/* fuzzy */
let best=null;
let bestScore=0;

for(const place of PLACES){

const candidates=[
place,
...(ALIASES[place]||[])
];

for(const candidate of candidates){

const score=similarity(normalized,candidate);

if(score>bestScore){

bestScore=score;
best=place;

}

}

}

if(best&&bestScore>=.55){

return{
place:best,
changed:true,
score:bestScore
};

}

return null;

}


/* =========================================================
   HAVERSINE
========================================================= */

function straightDistance(a,b){

const R=6371;

const p1=a.lat*Math.PI/180;
const p2=b.lat*Math.PI/180;

const dp=(b.lat-a.lat)*Math.PI/180;
const dl=(b.lon-a.lon)*Math.PI/180;

const x=
Math.sin(dp/2)**2+
Math.cos(p1)*
Math.cos(p2)*
Math.sin(dl/2)**2;

return R*
2*
Math.atan2(
Math.sqrt(x),
Math.sqrt(1-x)
);

}


/* =========================================================
   OSRM
========================================================= */

async function roadDistance(a,b){

const straight=straightDistance(a,b);

const url=
"https://router.project-osrm.org/route/v1/driving/"+
`${a.lon},${a.lat};${b.lon},${b.lat}`+
"?overview=false&alternatives=true";

try{

const response=await fetch(url);

if(!response.ok)throw new Error("OSRM "+response.status);

const data=await response.json();

if(
data.code!=="Ok"||
!data.routes||
!data.routes.length
){
throw new Error("No route");
}


/*
  نختار أقصر route معقول.
*/
let routes=data.routes
.filter(r=>Number.isFinite(r.distance));

routes.sort((x,y)=>x.distance-y.distance);

let km=routes[0].distance/1000;


/*
  حماية قوية من الأخطاء.

  مثال:
  إذا المسافة الجوية 1 km
  وOSRM قال 64 km
  فهذا غير منطقي.
*/
const maxReasonable=
Math.max(
12,
straight*4
);

if(km>maxReasonable){

/*
  تقدير طريق محلي:
  المسافة الجوية × 1.35
*/
return{
km:straight*1.35,
fallback:true,
reason:"مسار غير منطقي"
};

}

return{
km,
fallback:false
};

}catch(error){

console.log(error);

/*
  إذا فشل OSRM نهائياً.
*/
return{
km:straight*1.35,
fallback:true,
reason:"خدمة الطرق غير متاحة"
};

}

}


/* =========================================================
   السعر
========================================================= */

function getPrice(km){

if(km<=1)return 150;

if(km<=2)return 200;

if(km<=4)return 250;

if(km<=6)return 300;

if(km<=8)return 350;

if(km<=10)return 400;

if(km<=12)return 450;

if(km<=14)return 500;

if(km<=15)return 550;

/*
  فوق 15 كم:
  550 + 50 دج لكل كيلومتر بدأ
*/
return 550+
Math.ceil(km-15)*50;

}


/* =========================================================
   CALCULATE
========================================================= */

const fromInput=
document.getElementById("from").value;

const toInput=
document.getElementById("to").value;

const result=
document.getElementById("result");

const status=
document.getElementById("status");

const notice=
document.getElementById("notice");

result.style.display="none";
notice.style.display="none";
notice.innerHTML="";


if(!fromInput||!toInput){

status.innerHTML=
'<div class="error">⚠️ دخل نقطة الانطلاق ونقطة الوصول.</div>';

return;

}


const fromMatch=findPlace(fromInput);
const toMatch=findPlace(toInput);


if(!fromMatch){

status.innerHTML=
'<div class="error">❌ ما قدرتش نحدد نقطة الانطلاق.</div>';

return;

}


if(!toMatch){

status.innerHTML=
'<div class="error">❌ ما قدرتش نحدد نقطة الوصول.</div>';

return;

}


status.innerHTML=
"⏳ جاري حساب المسافة الفعلية بالطريق...";


/*
  الإحداثيات المحلية أولاً
*/
const fromCoords=
LOCAL_COORDS[fromMatch.place];

const toCoords=
LOCAL_COORDS[toMatch.place];


if(!fromCoords){

status.innerHTML=
'<div class="error">❌ إحداثيات الانطلاق غير موجودة.</div>';

return;

}


if(!toCoords){

status.innerHTML=
'<div class="error">❌ إحداثيات الوصول غير موجودة.</div>';

return;

}


const route=
await roadDistance(
fromCoords,
toCoords
);


const km=route.km;

const price=getPrice(km);


document.getElementById("resultFrom")
.textContent=fromMatch.place;

document.getElementById("resultTo")
.textContent=toMatch.place;

document.getElementById("distance")
.textContent=km.toFixed(1);

document.getElementById("price")
.textContent=
price.toLocaleString("fr-FR");


/*
  تصحيح الاسم
*/

const corrections=[];

if(fromMatch.changed){

corrections.push(
`الانطلاق: ${fromInput} → ${fromMatch.place}`
);

}

if(toMatch.changed){

corrections.push(
`الوصول: ${toInput} → ${toMatch.place}`
);

}


if(corrections.length){

notice.innerHTML=
"🔎 تم تصحيح الاسم تلقائياً:<br>"+
corrections.join("<br>");

notice.style.display="block";

}


/*
  تنبيه إذا اضطرينا للفallback
*/

if(route.fallback){

notice.innerHTML+=
(notice.innerHTML?"<br><br>":"")+
"⚠️ خدمة حساب الطريق أعطت نتيجة غير منطقية، لذلك تم استعمال تقدير طريق محلي مؤقتاً.";

notice.style.display="block";

}


result.style.display="block";

status.innerHTML=
'<span class="success">✅ تم حساب السعر.</span>';

}

if(e.key==="Enter")calculate();
