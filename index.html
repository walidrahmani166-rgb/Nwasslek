/* ---------------------------------------------------------
   2. سلم التسعيرة حسب المسافة
   --------------------------------------------------------- */

const PRICE_TABLE = [
  { max: 1,  price: 150 },
  { max: 2,  price: 200 },
  { max: 4,  price: 250 },
  { max: 6,  price: 300 },
  { max: 8,  price: 350 },

  { max: 12, price: 450 },

  { max: 15, price: 550 }
];

const EXTRA_PER_KM = 50;


/* ---------------------------------------------------------
   3. أدوات النص والبحث الذكي
   --------------------------------------------------------- */

function normalizeText(text) {

  return String(text || "")
    .toLowerCase()
    .trim()

    .replace(/[أإآ]/g, "ا")
    .replace(/ى/g, "ي")
    .replace(/ة/g, "ه")
    .replace(/ؤ/g, "و")
    .replace(/ئ/g, "ي")

    .replace(/[ًٌٍَُِّْـ]/g, "")

    .replace(/['"`’‘]/g, "")
    .replace(/[-_/.,()]/g, " ")

    .replace(/\s+/g, " ");
}


/* Levenshtein distance */

function levenshtein(a, b) {

  const matrix = [];

  for (let i = 0; i <= b.length; i++) {
    matrix[i] = [i];
  }

  for (let j = 0; j <= a.length; j++) {
    matrix[0][j] = j;
  }

  for (let i = 1; i <= b.length; i++) {

    for (let j = 1; j <= a.length; j++) {

      if (b.charAt(i - 1) === a.charAt(j - 1)) {

        matrix[i][j] = matrix[i - 1][j - 1];

      } else {

        matrix[i][j] = Math.min(
          matrix[i - 1][j] + 1,
          matrix[i][j - 1] + 1,
          matrix[i - 1][j - 1] + 1
        );
      }
    }
  }

  return matrix[b.length][a.length];
}


/* حساب نسبة التشابه */

function similarity(a, b) {

  a = normalizeText(a);
  b = normalizeText(b);

  if (!a || !b) return 0;

  if (a === b) return 1;

  if (a.includes(b) || b.includes(a)) {
    return 0.92;
  }

  const distance = levenshtein(a, b);
  const maxLength = Math.max(a.length, b.length);

  return maxLength === 0
    ? 1
    : 1 - distance / maxLength;
}


/* البحث عن أقرب منطقة */

function findBestZone(input) {

  const clean = normalizeText(input);

  if (!clean) return null;

  let best = null;
  let bestScore = 0;

  for (const zone of ZONES) {

    const names = [zone.name, ...(zone.aliases || [])];

    for (const alias of names) {

      const score = similarity(clean, alias);

      if (score > bestScore) {

        bestScore = score;

        best = {
          zone,
          score
        };
      }
    }
  }

  return best;
}

  const input = document.getElementById(inputId);

    const value = input.value.trim();

    if (!value) {

      suggestion.style.display = "none";

    }

    const best = findBestZone(value);

const CACHE_KEY = "nwasslek_geocode_cache_v3";

function getCache() {

  try {

    return JSON.parse(
      localStorage.getItem(CACHE_KEY) || "{}"
    );

  } catch {

    return {};
  }
}

function saveCache(cache) {

  try {

    localStorage.setItem(
      CACHE_KEY,
      JSON.stringify(cache)
    );

  } catch {

    // تجاهل خطأ التخزين
  }
}


/* ---------------------------------------------------------
   6. انتظار بين طلبات Nominatim
   --------------------------------------------------------- */

let lastGeocodeTime = 0;

async function waitForNominatimLimit() {

  const now = Date.now();

  const elapsed = now - lastGeocodeTime;

  const wait = Math.max(0, 1100 - elapsed);

  if (wait > 0) {

    await new Promise(resolve =>
      setTimeout(resolve, wait)
    );
  }

  lastGeocodeTime = Date.now();
}


/* ---------------------------------------------------------
   7. Geocoding
   --------------------------------------------------------- */

async function geocodePlace(zone) {

  const cache = getCache();

  const key = normalizeText(zone.name);

  if (cache[key]) {

    return cache[key];
  }


  await waitForNominatimLimit();


  const queries = [

    `${zone.name}, Médéa, Algérie`,

    `${zone.name}, Medea, Algeria`,

    `${zone.name}, Wilaya de Médéa, Algérie`
  ];


  for (const query of queries) {

    try {

      const url =
        "https://nominatim.openstreetmap.org/search?" +
        new URLSearchParams({
          q: query,
          format: "json",
          limit: "1",
          countrycodes: "dz",
          addressdetails: "1"
        });


      const response = await fetch(url, {
        headers: {
          "Accept": "application/json"
        }
      });


      if (!response.ok) {
        continue;
      }


      const data = await response.json();


      if (data && data.length > 0) {

        const result = {
          lat: Number(data[0].lat),
          lon: Number(data[0].lon),
          display: data[0].display_name
        };


        if (
          Number.isFinite(result.lat) &&
          Number.isFinite(result.lon)
        ) {

          cache[key] = result;

          saveCache(cache);

          return result;
        }
      }

    } catch (error) {

      console.warn(
        "Geocoding error:",
        error
      );
    }
  }


  return null;
}


/* ---------------------------------------------------------
   8. OSRM - حساب المسافة الحقيقية بالطريق
   --------------------------------------------------------- */

async function getRoadDistance(from, to) {

  const coordinates =
    `${from.lon},${from.lat};${to.lon},${to.lat}`;


  const url =
    `https://router.project-osrm.org/route/v1/driving/${coordinates}` +
    `?overview=false&alternatives=false&steps=false`;


  const response = await fetch(url);


  if (!response.ok) {

    throw new Error(
      "تعذر الاتصال بخدمة حساب الطريق."
    );
  }


  const data = await response.json();


  if (
    data.code !== "Ok" ||
    !data.routes ||
    !data.routes.length
  ) {

    throw new Error(
      "لم يتم العثور على طريق بين المكانين."
    );
  }


  return data.routes[0].distance / 1000;
}


/* ---------------------------------------------------------
   9. حساب السعر
   --------------------------------------------------------- */

function calculatePrice(distanceKm) {

  if (!Number.isFinite(distanceKm)) {
    return null;
  }


  /*
    نقرب المسافة إلى رقمين بعد الفاصلة
  */

  const distance =
    Math.round(distanceKm * 100) / 100;


  /*
    حتى 15 كم:
    نأخذ أول شريحة تصل إليها المسافة.
  */

  for (const row of PRICE_TABLE) {

    if (distance <= row.max) {

      return {
        price: row.price,
        label: `${row.price} دج`
      };
    }
  }


  /*
    أكثر من 15 كم:
    550 دج + 50 دج لكل كيلومتر إضافي بدأ.
  */

  const extraKm =
    Math.ceil(distance - 15);

  const price =
    550 + extraKm * EXTRA_PER_KM;


  return {
    price,
    label:
      `${price} دج`
  };
}

      showError(

    }


    const fromMatch =
      findBestZone(fromInput);

    const toMatch =
      findBestZone(toInput);


    if (!fromMatch || fromMatch.score < 0.45) {

      showError(
        `لم أتعرف على نقطة الانطلاق: "${fromInput}".`
      );

      return;
    }


    if (!toMatch || toMatch.score < 0.45) {

      showError(
        `لم أتعرف على نقطة الوصول: "${toInput}".`
      );

      return;
    }


    const fromZone =
      fromMatch.zone;

    const toZone =
      toMatch.zone;


    /*
      إذا كان هناك خطأ بسيط في الاسم،
      نستعمل الاسم الصحيح تلقائياً.
    */

    document.getElementById("from").value =
      fromZone.name;

    document.getElementById("to").value =
      toZone.name;


    const button =
      document.getElementById("calculateBtn");

    const loading =
      document.getElementById("loading");


    button.disabled = true;

    loading.style.display = "block";


    try {

      /*
        Geocode الانطلاق
      */

      const fromCoords =
        await geocodePlace(fromZone);


      if (!fromCoords) {

        throw new Error(
          `لم أستطع تحديد موقع "${fromZone.name}" على الخريطة.`
        );
      }


      /*
        Geocode الوصول
      */

      const toCoords =
        await geocodePlace(toZone);


      if (!toCoords) {

        throw new Error(
          `لم أستطع تحديد موقع "${toZone.name}" على الخريطة.`
        );
      }


      /*
        حساب الطريق الحقيقي
      */

      const distance =
        await getRoadDistance(
          fromCoords,
          toCoords
        );


      /*
        حساب السعر
      */

      const pricing =
        calculatePrice(distance);


      if (!pricing) {

        throw new Error(
          "تعذر حساب السعر."
        );
      }


      showResult(
        fromZone,
        toZone,
        distance,
        pricing
      );


    } catch (error) {

      console.error(error);

      showError(
        error.message ||
        "حدث خطأ أثناء حساب المسافة."
      );

    } finally {

      button.disabled = false;

      loading.style.display = "none";
    }

  });


/* ---------------------------------------------------------
   13. عرض قائمة المناطق
   --------------------------------------------------------- */

const zonesGrid =
  document.getElementById("zonesGrid");


ZONES.forEach(zone => {

  const div =
    document.createElement("div");

  div.className = "zone";

  div.innerHTML = `
    <strong>${zone.name}</strong>
    <small>${zone.reference}</small>
  `;

  zonesGrid.appendChild(div);
});


/* ---------------------------------------------------------
   14. Enter = حساب
   --------------------------------------------------------- */

document
  .getElementById("from")
  .addEventListener("keydown", event => {

    if (event.key === "Enter") {

      document.getElementById("to").focus();
    }
  });


document
  .getElementById("to")
  .addEventListener("keydown", event => {

    if (event.key === "Enter") {

      document.getElementById("calculateBtn").click();
    }
  });


</script>
