      id="to"

    <button id="calculateBtn" onclick="calculate()">

      ⏳ جاري تحديد المكان وحساب المسافة بالطريق...

/* =========================================================
   إحداثيات محلية موثوقة
   الأماكن الأخرى سيتم البحث عنها تلقائياً
========================================================= */

const LOCAL_COORDS = {

"تاكبو":{
lat:36.26049,
lon:2.77299
},

"عين الذهب":{
lat:36.26672,
lon:2.78108
},

"واد زيتون":{
lat:36.25206,
lon:2.76358
},

"كوالة":{
lat:36.28923,
lon:2.76317
},

"مرج شكير":{
lat:36.27866,
lon:2.76039
},

"الكتاب":{
lat:36.27097,
lon:2.78130
},

"باتي":{
lat:36.24803,
lon:2.74210
},

"مكراز":{
lat:36.24657,
lon:2.74168
},

"قطيطين":{
lat:36.25391,
lon:2.75658
}

};

/* =========================================================
   القائمة
========================================================= */

const datalist=document.getElementById("places");

PLACES.forEach(place=>{

  const option=document.createElement("option");

  option.value=place;

  datalist.appendChild(option);

});


/* =========================================================
   تنظيف الاسم
========================================================= */

function normalize(text){

  return String(text)
  .toLowerCase()
  .trim()

  .replace(/[أإآ]/g,"ا")
  .replace(/ة/g,"ه")
  .replace(/ى/g,"ي")

  .replace(/[ًٌٍَُِّْـ]/g,"")

  .replace(/[’'`]/g,"")

  .replace(/[-_]/g," ")

  .replace(/\s+/g," ");

}


/* =========================================================
   البحث الذكي
========================================================= */

function levenshtein(a,b){

  const matrix=[];

  for(let i=0;i<=b.length;i++){

    matrix[i]=[i];

  }

  for(let j=0;j<=a.length;j++){

    matrix[0][j]=j;

  }

  for(let i=1;i<=b.length;i++){

    for(let j=1;j<=a.length;j++){

      if(b[j-1]===a[i-1]){

        matrix[i][j]=matrix[i-1][j-1];

      }else{

        matrix[i][j]=Math.min(

          matrix[i-1][j-1]+1,

          matrix[i][j-1]+1,

          matrix[i-1][j]+1

        );

      }

    }

  }

  return matrix[b.length][a.length];

}


function findPlace(input){

  const value=normalize(input);

  if(!value) return null;


  /* تطابق مباشر */

  for(const place of PLACES){

    if(normalize(place)===value){

      return {
        name:place,
        corrected:false
      };

    }

  }


  /* aliases */

  for(const place of PLACES){

    const names=[
      place,
      ...(ALIASES[place]||[])
    ];

    for(const name of names){

      if(normalize(name)===value){

        return {
          name:place,
          corrected:true
        };

      }

    }

  }


  /* بحث قريب */

  let best=null;

  for(const place of PLACES){

    const names=[
      place,
      ...(ALIASES[place]||[])
    ];

    for(const name of names){

      const n=normalize(name);

      const distance=levenshtein(value,n);

      const max=Math.max(
        value.length,
        n.length
      );

      const similarity=1-distance/max;

      if(similarity>=0.55){

        if(!best || similarity>best.similarity){

          best={
            name:place,
            corrected:true,
            similarity
          };

        }

      }

    }

  }

  return best;

}


/* =========================================================
   Cache
========================================================= */

function getCache(){

  try{

    return JSON.parse(
      localStorage.getItem("nwasslek_geocode_cache")||"{}"
    );

  }catch(e){

    return {};

  }

}

function saveCache(cache){

  localStorage.setItem(
    "nwasslek_geocode_cache",
    JSON.stringify(cache)
  );

}


/* =========================================================
   احترام حد Nominatim
========================================================= */

let lastRequest=0;

async function waitNominatim(){

  const now=Date.now();

  const wait=Math.max(
    0,
    1100-(now-lastRequest)
  );

  if(wait>0){

    await new Promise(resolve=>
      setTimeout(resolve,wait)
    );

  }

  lastRequest=Date.now();

}


/* =========================================================
   Geocoding
   Local → Cache → Nominatim → Photon
========================================================= */

async function geocode(place){

  /* 1 - إحداثيات محلية */

  if(LOCAL_COORDS[place]){

    return LOCAL_COORDS[place];

  }


  /* 2 - Cache */

  const cache=getCache();

  if(cache[place]){

    return cache[place];

  }


  /* 3 - تجهيز الاستعلامات */

  let queries=[];


  if(place==="Rue d'Algé"){

    queries=[
      "Rue d'Alger, Médéa, Algeria",
      "Route d'Alger, Médéa, Algeria",
      "طريق الجزائر المدية الجزائر"
    ];

  }else{

    const aliases=ALIASES[place]||[];

    queries=[
      `${place}, Médéa, Algeria`,
      ...aliases.map(x=>`${x}, Médéa, Algeria`)
    ];

  }


  /* 4 - Nominatim */

  for(const query of queries){

    try{

      await waitNominatim();

      const url=
        "https://nominatim.openstreetmap.org/search"+
        "?format=jsonv2"+
        "&limit=1"+
        "&countrycodes=dz"+
        "&q="+encodeURIComponent(query);

      const response=await fetch(url);

      if(!response.ok) continue;

      const data=await response.json();

      if(data.length){

        const coords={
          lat:parseFloat(data[0].lat),
          lon:parseFloat(data[0].lon)
        };

        /* نرفض النتائج البعيدة جدًا عن Médéa */

        const d=distanceStraight(
          coords.lat,
          coords.lon,
          36.2675,
          2.75
        );

        if(d<=60){

          cache[place]=coords;

          saveCache(cache);

          return coords;

        }

      }

    }catch(e){

      console.log("Nominatim:",e);

    }

  }


  /* 5 - Photon كاحتياط */

  for(const query of queries){

    try{

      const url=
        "https://photon.komoot.io/api/"+
        "?limit=1"+
        "&q="+encodeURIComponent(query);

      const response=await fetch(url);

      if(!response.ok) continue;

      const data=await response.json();

      if(
        data.features &&
        data.features.length
      ){

        const c=
          data.features[0].geometry.coordinates;

        const coords={
          lat:parseFloat(c[1]),
          lon:parseFloat(c[0])
        };

        const d=distanceStraight(
          coords.lat,
          coords.lon,
          36.2675,
          2.75
        );

        if(d<=60){

          cache[place]=coords;

          saveCache(cache);

          return coords;

        }

      }

    }catch(e){

      console.log("Photon:",e);

    }

  }


  return null;

}


/* =========================================================
   مسافة جوية للتأكد فقط
========================================================= */

function distanceStraight(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R=6371;

  const p1=lat1*Math.PI/180;
  const p2=lat2*Math.PI/180;

  const dp=
    (lat2-lat1)*Math.PI/180;

  const dl=
    (lon2-lon1)*Math.PI/180;

  const a=
    Math.sin(dp/2)**2+
    Math.cos(p1)*
    Math.cos(p2)*
    Math.sin(dl/2)**2;

  return 2*R*Math.atan2(
    Math.sqrt(a),
    Math.sqrt(1-a)
  );

}


/* =========================================================
   حساب المسافة بالطريق
========================================================= */

async function roadDistance(a,b){

  const url=
    "https://router.project-osrm.org/route/v1/driving/"+
    `${a.lon},${a.lat};${b.lon},${b.lat}`+
    "?overview=false";

  const response=await fetch(url);

  if(!response.ok){

    throw new Error(
      "تعذر الاتصال بخدمة الطريق."
    );

  }

  const data=await response.json();

  if(
    !data.routes ||
    !data.routes.length
  ){

    throw new Error(
      "لم يتم العثور على طريق بين النقطتين."
    );

  }

  return data.routes[0].distance/1000;

}


/* =========================================================
   التسعيرة
========================================================= */

function getPrice(km){

  if(km<=1)  return 150;
  if(km<=2)  return 200;
  if(km<=4)  return 250;
  if(km<=6)  return 300;
  if(km<=8)  return 350;
  if(km<=10) return 400;
  if(km<=12) return 450;
  if(km<=14) return 500;
  if(km<=15) return 550;

  return 550+
    Math.ceil(km-15)*50;

}


/* =========================================================
   Error
========================================================= */

function showError(message){

  const el=
    document.getElementById("error");

  el.textContent=message;

  el.style.display="block";

}


/* =========================================================
   الحساب الرئيسي
========================================================= */

async function calculate(){

  const fromInput=
    document.getElementById("from").value;

  const toInput=
    document.getElementById("to").value;

  const button=
    document.getElementById("calculateBtn");

  const loading=
    document.getElementById("loading");

  const error=
    document.getElementById("error");

  const result=
    document.getElementById("result");

  const correction=
    document.getElementById("correction");


  error.style.display="none";

  result.style.display="none";

  correction.innerHTML="";


  if(!fromInput || !toInput){

    showError(
      "⚠️ اكتب نقطة الانطلاق ونقطة الوصول."
    );

    return;

  }


  /* البحث الذكي */

  const from=findPlace(fromInput);

  const to=findPlace(toInput);


  if(!from){

    showError(
      `❌ لم أتعرف على "${fromInput}".`
    );

    return;

  }


  if(!to){

    showError(
      `❌ لم أتعرف على "${toInput}".`
    );

    return;

  }


  button.disabled=true;

  loading.style.display="block";


  try{

    /* تصحيح الأسماء */

    if(from.corrected){

      document.getElementById("from").value=
        from.name;

    }

    if(to.corrected){

      document.getElementById("to").value=
        to.name;

    }


    /* تحديد الإحداثيات */

    const fromCoords=
      await geocode(from.name);

    const toCoords=
      await geocode(to.name);


    if(!fromCoords){

      throw new Error(
        `لم أستطع تحديد موقع "${from.name}" على الخريطة.`
      );

    }


    if(!toCoords){

      throw new Error(
        `لم أستطع تحديد موقع "${to.name}" على الخريطة.`
      );

    }


    /* حساب الطريق */

    const km=
      await roadDistance(
        fromCoords,
        toCoords
      );


    /* السعر */

    const price=
      getPrice(km);


    document.getElementById("distance")
      .textContent=
      km.toFixed(1)+" كم";


    document.getElementById("price")
      .textContent=
      price.toLocaleString("fr-DZ")+" دج";


    /* رسالة التصحيح */

    const messages=[];


    if(from.corrected){

      messages.push(
        `📍 الانطلاق: تم التعرف عليها كـ «${from.name}»`
      );

    }


    if(to.corrected){

      messages.push(
        `🏁 الوصول: تم التعرف عليها كـ «${to.name}»`
      );

    }


    if(messages.length){

      correction.innerHTML=
        `<div class="correction">
          ${messages.join("<br>")}
        </div>`;

    }


    result.style.display="block";


  }catch(errorObject){

    console.error(errorObject);

    showError(
      "❌ "+errorObject.message
    );


  }finally{

    button.disabled=false;

    loading.style.display="none";

  }

}


/* =========================================================
   Enter
========================================================= */

document.getElementById("from")
.addEventListener("keydown",function(e){

  if(e.key==="Enter"){

    document.getElementById("to").focus();

  }

});


document.getElementById("to")
.addEventListener("keydown",function(e){

  if(e.key==="Enter"){

    calculate();

  }

});

</script>
