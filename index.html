/* =========================================================
   NORMALIZE
========================================================= */

function normalize(str){
  return String(str || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[أإآ]/g,"ا")
    .replace(/ة/g,"ه")
    .replace(/ى/g,"ي")
    .replace(/ؤ/g,"و")
    .replace(/ئ/g,"ي")
    .replace(/ـ/g,"")
    .replace(/[^a-z0-9\u0600-\u06ff]+/g,"")
    .trim();
}


/* =========================================================
   LEVENSHTEIN
========================================================= */

function levenshtein(a,b){

  a=normalize(a);
  b=normalize(b);

  const matrix=[];

  for(let i=0;i<=b.length;i++){
    matrix[i]=[i];
  }

  for(let j=0;j<=a.length;j++){
    matrix[0][j]=j;
  }

  for(let i=1;i<=b.length;i++){
    for(let j=1;j<=a.length;j++){

      if(b.charAt(i-1)===a.charAt(j-1)){
        matrix[i][j]=matrix[i-1][j-1];
      }else{
        matrix[i][j]=Math.min(
          matrix[i-1][j-1]+1,
          matrix[i][j-1]+1,
          matrix[i-1][j]+1
        );
      }

    }
  }

  return matrix[b.length][a.length];
}


/* =========================================================
   FIND PLACE
========================================================= */

function findPlace(input){

  const raw=String(input || "").trim();
  const n=normalize(raw);

  if(!n) return null;

  /* aliases */
  for(const key in ALIASES){
    if(normalize(key)===n){
      const name=ALIASES[key];
      return {
        place:PLACES.find(p=>p.name===name),
        corrected:name,
        exact:true
      };
    }
  }

  /* exact place */
  for(const p of PLACES){
    if(normalize(p.name)===n){
      return {
        place:p,
        corrected:p.name,
        exact:true
      };
    }
  }

  /* contains */
  let contains=[];

  for(const p of PLACES){

    const pn=normalize(p.name);

    if(pn.includes(n) || n.includes(pn)){
      contains.push(p);
    }

  }

  if(contains.length){
    return {
      place:contains[0],
      corrected:contains[0].name,
      exact:false
    };
  }

  /* fuzzy */
  let best=null;
  let bestDistance=Infinity;

  for(const p of PLACES){

    const d=levenshtein(n,p.name);

    if(d<bestDistance){
      bestDistance=d;
      best=p;
    }

  }

  if(best && bestDistance<=Math.max(3,Math.floor(n.length*.45))){
    return {
      place:best,
      corrected:best.name,
      exact:false
    };
  }

  return null;
}


/* =========================================================
   SUGGESTIONS
========================================================= */

function showSuggestions(type){

  const input=document.getElementById(type).value.trim();
  const box=document.getElementById(type+"Suggestions");

  if(!input){
    box.innerHTML="";
    return;
  }

  const n=normalize(input);

  let ranked=PLACES.map(p=>{

    const pn=normalize(p.name);

    let score=levenshtein(n,pn);

    if(pn.includes(n)) score-=20;
    if(n.includes(pn)) score-=10;

    return {p,score};

  });

  ranked.sort((a,b)=>a.score-b.score);

  box.innerHTML="";

  ranked.slice(0,6).forEach(item=>{

    const div=document.createElement("div");
    div.className="suggestion";
    div.textContent=item.p.name;

    div.onclick=()=>{

      document.getElementById(type).value=item.p.name;
      box.innerHTML="";

    };

    box.appendChild(div);

  });

}

/* =========================================================
   HAVERSINE
========================================================= */

function haversine(a,b){

  const R=6371;

  const lat1=a.lat*Math.PI/180;
  const lat2=b.lat*Math.PI/180;

  const dLat=(b.lat-a.lat)*Math.PI/180;
  const dLon=(b.lon-a.lon)*Math.PI/180;

  const x=
    Math.sin(dLat/2)**2+
    Math.cos(lat1)*
    Math.cos(lat2)*
    Math.sin(dLon/2)**2;

  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));

}


/* =========================================================
   ROAD DISTANCE - OSRM
========================================================= */

async function roadDistance(a,b){

  const url=
    "https://router.project-osrm.org/route/v1/driving/"+
    `${a.lon},${a.lat};${b.lon},${b.lat}`+
    "?overview=false&alternatives=true&steps=false";

  try{

    const response=await fetch(url);

    if(!response.ok){
      throw new Error("OSRM error");
    }

    const data=await response.json();

    if(
      data.code==="Ok" &&
      data.routes &&
      data.routes.length
    ){

      let routes=data.routes
        .map(r=>r.distance/1000)
        .filter(d=>Number.isFinite(d));

      if(routes.length){

        /*
          نستعمل أقصر طريق حقيقي رجعه OSRM.
        */
        const distance=Math.min(...routes);

        const straight=haversine(a,b);

        /*
          حماية من نتائج routing غير منطقية.
        */
        if(distance <= Math.max(12,straight*4)){
          return {
            distance,
            fallback:false
          };
        }

      }

    }

  }catch(e){

    console.log(e);

  }

  /*
    fallback فقط إذا فشل OSRM.
  */
  return {
    distance:haversine(a,b)*1.35,
    fallback:true
  };

}


/* =========================================================
   PRICE
========================================================= */

function calculatePrice(km){

  if(km<=1) return 150;
  if(km<=2) return 200;
  if(km<=4) return 250;
  if(km<=6) return 300;
  if(km<=8) return 350;
  if(km<=10) return 400;
  if(km<=12) return 450;
  if(km<=14) return 500;
  if(km<=15) return 550;

  return 550 + Math.ceil(km-15)*50;

}


/* =========================================================
   CALCULATE
========================================================= */

async function calculate(){

  const fromInput=document.getElementById("from").value;
  const toInput=document.getElementById("to").value;

  const from=findPlace(fromInput);
  const to=findPlace(toInput);

  const result=document.getElementById("result");
  const warning=document.getElementById("warning");
  const note=document.getElementById("note");

  warning.style.display="none";
  warning.innerHTML="";

  if(!from || !to){

    result.style.display="block";

    document.getElementById("distance").textContent="!";
    document.getElementById("price").textContent="";

    note.innerHTML=
      "❌ ما قدرتش نحدد إحدى المناطق. حاول تكتب الاسم بطريقة أخرى.";

    return;

  }

  document.getElementById("fromPlace").textContent=from.corrected;
  document.getElementById("toPlace").textContent=to.corrected;

  result.style.display="block";

  document.getElementById("distance").textContent="...";

  document.getElementById("price").textContent="...";

  note.innerHTML="جاري حساب أقصر مسار بالسيارة...";

  const route=await roadDistance(from.place,to.place);

  const km=route.distance;

  const price=calculatePrice(km);

  document.getElementById("distance").textContent=
    km.toFixed(1);

  document.getElementById("price").textContent=
    price.toLocaleString("fr-FR");

  note.innerHTML=
    "💰 التسعيرة محسوبة حسب المسافة بين نقطتي الانطلاق والوصول.";

  let messages=[];

  if(!from.exact){
    messages.push(
      `تم تصحيح مكان الانطلاق إلى: <b>${from.corrected}</b>`
    );
  }

  if(!to.exact){
    messages.push(
      `تم تصحيح مكان الوصول إلى: <b>${to.corrected}</b>`
    );
  }

  if(route.fallback){

    messages.push(
      "تعذر الوصول إلى خدمة حساب الطرق حالياً، لذلك تم استعمال تقدير احتياطي للمسافة."
    );

  }

  if(messages.length){

    warning.style.display="block";

    warning.innerHTML=messages.join("<br>");

  }

}


/* =========================================================
   ENTER KEY
========================================================= */

document.addEventListener("keydown",function(e){

  if(e.key==="Enter"){

    const active=document.activeElement;

    if(
      active &&
      (active.id==="from" || active.id==="to")
    ){
      calculate();
    }

  }

});

</script>
