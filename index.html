/* =========================================================
   TEXT NORMALIZATION
========================================================= */

function normalizeText(value){

  if(!value) return "";

  return value
    .toString()
    .trim()
    .toLowerCase()

    // Arabic normalization
    .replace(/[إأآا]/g,"ا")
    .replace(/ى/g,"ي")
    .replace(/ئ/g,"ي")
    .replace(/ؤ/g,"و")
    .replace(/ة/g,"ه")

    // remove punctuation
    .replace(/[’'`´"]/g,"")
    .replace(/[.,،؛;:_\-\/\\()[\]{}]/g," ")

    // multiple spaces
    .replace(/\s+/g," ")
    .trim();
}


/* =========================================================
   LEVENSHTEIN
========================================================= */

function levenshtein(a,b){

  const matrix=[];

  for(let i=0;i<=b.length;i++){
    matrix[i]=[i];
  }

  for(let j=0;j<=a.length;j++){
    matrix[0][j]=j;
  }

  for(let i=1;i<=b.length;i++){

    for(let j=1;j<=a.length;j++){

      if(b.charAt(i-1) === a.charAt(j-1)){
        matrix[i][j]=matrix[i-1][j-1];
      }else{
        matrix[i][j]=Math.min(
          matrix[i-1][j-1]+1,
          matrix[i][j-1]+1,
          matrix[i-1][j]+1
        );
      }
    }
  }

  return matrix[b.length][a.length];
}


/* =========================================================
   SMART PLACE MATCHING
========================================================= */

function similarity(a,b){

  a=normalizeText(a);
  b=normalizeText(b);

  if(!a || !b) return 0;

  if(a===b) return 1;

  if(a.includes(b) || b.includes(a)){
    return 0.90;
  }

  const max=Math.max(a.length,b.length);

  if(!max) return 0;

  return 1-(levenshtein(a,b)/max);
}


function findPlace(input){

  const original=(input || "").trim();

  if(!original){
    return {
      place:null,
      score:0,
      changed:false
    };
  }

  const normalized=normalizeText(original);

  /* Exact place name */
  for(const place of PLACES){

    if(normalizeText(place)===normalized){

      return {
        place,
        score:1,
        changed:place!==original
      };
    }
  }

  /* Exact alias */
  for(const place of PLACES){

    const aliases=ALIASES[place] || [];

    for(const alias of aliases){

      if(normalizeText(alias)===normalized){

        return {
          place,
          score:1,
          changed:true
        };
      }
    }
  }

  /* Similarity search */
  let bestPlace=null;
  let bestScore=0;

  for(const place of PLACES){

    const candidates=[
      place,
      ...(ALIASES[place] || [])
    ];

    for(const candidate of candidates){

      const score=similarity(normalized,candidate);

      if(score>bestScore){

        bestScore=score;
        bestPlace=place;
      }
    }
  }

  /*
    Accept reasonably close spelling.
    This prevents completely unrelated names
    from being accepted.
  */
  if(bestPlace && bestScore>=0.55){

    return {
      place:bestPlace,
      score:bestScore,
      changed:true
    };
  }

  return {
    place:null,
    score:bestScore,
    changed:false
  };
}


/* =========================================================
   CACHE
========================================================= */

function cacheKey(place){

  return "nwasslek_coords_" + normalizeText(place);
}


function getCache(place){

  try{

    const value=localStorage.getItem(cacheKey(place));

    if(!value) return null;

    return JSON.parse(value);

  }catch(e){

    return null;
  }
}


function saveCache(place,coords){

  try{

    localStorage.setItem(
      cacheKey(place),
      JSON.stringify(coords)
    );

  }catch(e){}
}


/* =========================================================
   LOCAL COORDINATES
========================================================= */

function getLocalCoords(place){

  if(
    LOCAL_COORDS[place] &&
    Number.isFinite(LOCAL_COORDS[place].lat) &&
    Number.isFinite(LOCAL_COORDS[place].lon)
  ){

    return {
      lat:LOCAL_COORDS[place].lat,
      lon:LOCAL_COORDS[place].lon,
      source:"local"
    };
  }

  return null;
}


/* =========================================================
   NOMINATIM DELAY
========================================================= */

let lastNominatimCall=0;

async function waitNominatim(){

  const now=Date.now();

  const wait=Math.max(
    0,
    1100-(now-lastNominatimCall)
  );

  if(wait>0){

    await new Promise(resolve=>{
      setTimeout(resolve,wait);
    });
  }

  lastNominatimCall=Date.now();
}


/* =========================================================
   NOMINATIM
========================================================= */

async function geocodeNominatim(place){

  await waitNominatim();

  const query=
    encodeURIComponent(
      place + ", Médéa, Algeria"
    );

  const url=
    "https://nominatim.openstreetmap.org/search" +
    "?format=jsonv2" +
    "&limit=5" +
    "&countrycodes=dz" +
    "&q=" + query;

  try{

    const response=await fetch(url,{
      headers:{
        "Accept":"application/json"
      }
    });

    if(!response.ok){
      return null;
    }

    const data=await response.json();

    if(!Array.isArray(data) || !data.length){
      return null;
    }

    /*
      Médéa approximate bounding box.
      This prevents accidental matches elsewhere.
    */
    const MEDEA={
      minLat:36.15,
      maxLat:36.38,
      minLon:2.60,
      maxLon:2.95
    };

    for(const item of data){

      const lat=parseFloat(item.lat);
      const lon=parseFloat(item.lon);

      if(
        lat>=MEDEA.minLat &&
        lat<=MEDEA.maxLat &&
        lon>=MEDEA.minLon &&
        lon<=MEDEA.maxLon
      ){

        return {
          lat,
          lon,
          source:"nominatim"
        };
      }
    }

  }catch(error){

    console.warn("Nominatim error:",error);
  }

  return null;
}


/* =========================================================
   PHOTON FALLBACK
========================================================= */

async function geocodePhoton(place){

  const query=
    encodeURIComponent(
      place + ", Medea, Algeria"
    );

  const url=
    "https://photon.komoot.io/api/" +
    "?limit=5" +
    "&q=" + query;

  try{

    const response=await fetch(url);

    if(!response.ok){
      return null;
    }

    const data=await response.json();

    if(
      !data ||
      !Array.isArray(data.features) ||
      !data.features.length
    ){
      return null;
    }

    const MEDEA={
      minLat:36.15,
      maxLat:36.38,
      minLon:2.60,
      maxLon:2.95
    };

    for(const feature of data.features){

      if(
        !feature.geometry ||
        !Array.isArray(feature.geometry.coordinates)
      ){
        continue;
      }

      const lon=parseFloat(
        feature.geometry.coordinates[0]
      );

      const lat=parseFloat(
        feature.geometry.coordinates[1]
      );

      if(
        lat>=MEDEA.minLat &&
        lat<=MEDEA.maxLat &&
        lon>=MEDEA.minLon &&
        lon<=MEDEA.maxLon
      ){

        return {
          lat,
          lon,
          source:"photon"
        };
      }
    }

  }catch(error){

    console.warn("Photon error:",error);
  }

  return null;
}


/* =========================================================
   MAIN GEOCODER
========================================================= */

async function geocode(place){

  /*
    1. LOCAL COORDINATES FIRST
    This is the important part.
  */

  const local=getLocalCoords(place);

  if(local){
    return local;
  }


  /*
    2. CACHE
  */

  const cached=getCache(place);

  if(cached){

    return {
      ...cached,
      source:"cache"
    };
  }


  /*
    3. NOMINATIM
  */

  const nominatim=
    await geocodeNominatim(place);

  if(nominatim){

    saveCache(place,nominatim);

    return nominatim;
  }


  /*
    4. PHOTON
  */

  const photon=
    await geocodePhoton(place);

  if(photon){

    saveCache(place,photon);

    return photon;
  }


  return null;
}


/* =========================================================
   HAVERSINE
========================================================= */

function straightDistance(a,b){

  const R=6371;

  const lat1=a.lat*Math.PI/180;
  const lat2=b.lat*Math.PI/180;

  const dLat=
    (b.lat-a.lat)*Math.PI/180;

  const dLon=
    (b.lon-a.lon)*Math.PI/180;

  const x=
    Math.sin(dLat/2)**2+
    Math.cos(lat1)*
    Math.cos(lat2)*
    Math.sin(dLon/2)**2;

  const c=
    2*Math.atan2(
      Math.sqrt(x),
      Math.sqrt(1-x)
    );

  return R*c;
}


/* =========================================================
   OSRM ROAD DISTANCE
========================================================= */

async function roadDistance(a,b){

  const url=
    "https://router.project-osrm.org/route/v1/driving/" +
    `${a.lon},${a.lat};${b.lon},${b.lat}` +
    "?overview=false";

  try{

    const response=await fetch(url);

    if(!response.ok){
      throw new Error("OSRM HTTP "+response.status);
    }

    const data=await response.json();

    if(
      data.code!=="Ok" ||
      !data.routes ||
      !data.routes.length
    ){

      throw new Error("No route");
    }

    return {
      km:data.routes[0].distance/1000,
      seconds:data.routes[0].duration
    };

  }catch(error){

    console.warn("OSRM error:",error);

    /*
      Fallback:
      if routing service fails,
      use straight distance multiplied by
      a road factor.
    */

    const straight=
      straightDistance(a,b);

    return {
      km:straight*1.25,
      seconds:null,
      fallback:true
    };
  }
}


/* =========================================================
   PRICE
========================================================= */

function getPrice(km){

  if(km<=1){
    return 150;
  }

  if(km<=2){
    return 200;
  }

  if(km<=4){
    return 250;
  }

  if(km<=6){
    return 300;
  }

  if(km<=8){
    return 350;
  }

  if(km<=10){
    return 400;
  }

  if(km<=12){
    return 450;
  }

  if(km<=14){
    return 500;
  }

  if(km<=15){
    return 550;
  }

  /*
    More than 15 km:
    +50 DA for every started kilometer.
  */

  return 550+
    Math.ceil(km-15)*50;
}


/* =========================================================
   FORMAT
========================================================= */

function formatKm(km){

  return km.toFixed(1);
}


/* =========================================================
   STATUS
========================================================= */

function setStatus(text){

  document.getElementById("status").innerHTML=text;
}


/* =========================================================
   CALCULATE
========================================================= */

async function calculate(){

  const fromInput=
    document.getElementById("from").value;

  const toInput=
    document.getElementById("to").value;


  document.getElementById("result").style.display="none";
  document.getElementById("correction").style.display="none";


  if(!fromInput || !toInput){

    setStatus(
      '<div class="error">⚠️ دخل نقطة الانطلاق ونقطة الوصول.</div>'
    );

    return;
  }


  const fromMatch=
    findPlace(fromInput);

  const toMatch=
    findPlace(toInput);


  if(!fromMatch.place){

    setStatus(
      '<div class="error">❌ ما قدرتش نحدد نقطة الانطلاق.</div>'
    );

    return;
  }


  if(!toMatch.place){

    setStatus(
      '<div class="error">❌ ما قدرتش نحدد نقطة الوصول.</div>'
    );

    return;
  }


  setStatus(
    "⏳ جاري تحديد الإحداثيات وحساب مسافة الطريق..."
  );


  /*
    Get coordinates.
  */

  const fromCoords=
    await geocode(fromMatch.place);

  const toCoords=
    await geocode(toMatch.place);


  if(!fromCoords){

    setStatus(
      `<div class="error">
        ❌ تعذر تحديد إحداثيات:
        <strong>${fromMatch.place}</strong>
      </div>`
    );

    return;
  }


  if(!toCoords){

    setStatus(
      `<div class="error">
        ❌ تعذر تحديد إحداثيات:
        <strong>${toMatch.place}</strong>
      </div>`
    );

    return;
  }


  setStatus(
    "🛣️ جاري حساب المسافة الفعلية بالطريق..."
  );


  const route=
    await roadDistance(
      fromCoords,
      toCoords
    );


  if(!route || !Number.isFinite(route.km)){

    setStatus(
      '<div class="error">❌ تعذر حساب المسافة.</div>'
    );

    return;
  }


  const km=route.km;

  const price=getPrice(km);


  /*
    Show result.
  */

  document.getElementById("resultFrom")
    .textContent=fromMatch.place;

  document.getElementById("resultTo")
    .textContent=toMatch.place;

  document.getElementById("distance")
    .textContent=formatKm(km);

  document.getElementById("price")
    .textContent=price.toLocaleString("fr-FR");


  /*
    Correction message.
  */

  const corrections=[];


  if(fromMatch.changed){

    corrections.push(
      `الانطلاق: «${fromInput}» → «${fromMatch.place}»`
    );
  }


  if(toMatch.changed){

    corrections.push(
      `الوصول: «${toInput}» → «${toMatch.place}»`
    );
  }


  const correctionBox=
    document.getElementById("correction");


  if(corrections.length){

    correctionBox.innerHTML=
      "🔎 تم تصحيح اسم المكان تلقائياً:<br>" +
      corrections.join("<br>");

    correctionBox.style.display="block";
  }


  if(route.fallback){

    correctionBox.innerHTML +=
      (correctionBox.innerHTML ? "<br><br>" : "")+
      "ℹ️ خدمة حساب الطريق غير متاحة حالياً، تم استعمال تقدير المسافة.";

    correctionBox.style.display="block";
  }


  document.getElementById("result")
    .style.display="block";


  setStatus("✅ تم حساب السعر بنجاح.");
}


/* =========================================================
   ENTER KEY
========================================================= */

document.getElementById("from")
  .addEventListener("keydown",function(e){

    if(e.key==="Enter"){
      document.getElementById("to").focus();
    }

  });


document.getElementById("to")
  .addEventListener("keydown",function(e){

    if(e.key==="Enter"){
      calculate();
    }

  });

</script>
